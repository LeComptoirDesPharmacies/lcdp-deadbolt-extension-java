name: Run java Test

on:
  push:
    branches:
      - 'develop'
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'

jobs:
  Test_application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # jgitver derives the version from the git history — a shallow clone leaves
          # it with no tag to work from. Same as releases.yml.
          fetch-depth: 0

      - run: git fetch --tags --force origin # WA: https://github.com/actions/checkout/issues/882

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Run tests
        # `verify` compiles, runs the tests and builds the jar/sources/javadoc — all of
        # what `deploy` does before uploading, and nothing that uploads. gpg.skip
        # because the gpg plugin is bound to the `verify` phase and would otherwise
        # demand the release signing key just to run the tests.
        run: mvn --batch-mode verify -Dgpg.skip=true
